name: Docker Hub Frontend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hoelk-f"
      - name: Check release secrets and authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          MANAGER_TOKEN: ${{ secrets.MANAGER_DISPATCH_TOKEN || secrets.NPM_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_FRONTEND }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in NPM_TOKEN MANAGER_TOKEN DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing repository secret ${secret_name}." >&2
              exit 1
            fi
          done

          NODE_AUTH_TOKEN="$NPM_TOKEN" npm whoami --registry https://npm.pkg.github.com >/dev/null
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${MANAGER_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hoelk-f/solid-dataspace-manager >/dev/null
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Build library
        run: npm run build:lib
        working-directory: ./frontend
      - name: Validate package version
        id: package-version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ./frontend
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { execFileSync } = require('child_process');
          const { appendFileSync } = require('fs');
          const pkg = require('./package.json');

          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const parse = (version, label) => {
            if (!stableSemver.test(version)) {
              throw new Error(`${label} must be a stable x.y.z version, got ${version || '<empty>'}.`);
            }
            return version.split('.').map((part) => BigInt(part));
          };
          const cmp = (a, b) => {
            const pa = parse(a, 'Current version');
            const pb = parse(b, 'Published version');
            for (let i = 0; i < 3; i += 1) {
              if (pa[i] > pb[i]) return 1;
              if (pa[i] < pb[i]) return -1;
            }
            return 0;
          };

          const readPublishedVersion = (spec) => {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                return execFileSync(
                  'npm',
                  ['view', spec, 'version', '--registry', 'https://npm.pkg.github.com', '--loglevel=error'],
                  { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] },
                ).trim();
              } catch (error) {
                const diagnostic = `${error.stdout || ''}\n${error.stderr || ''}\n${error.message || ''}`;
                if (/(^|\s)E404(\s|$)|404 Not Found/i.test(diagnostic)) {
                  if (attempt === 3) return '';
                  Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
                  continue;
                }
                if (attempt === 3) {
                  throw new Error(`Unable to query ${spec}; registry availability is unknown. ${diagnostic.trim()}`);
                }
                Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
              }
            }
            throw new Error(`Unable to query ${spec}.`);
          };

          parse(pkg.version, 'frontend/package.json version');
          const latest = readPublishedVersion('@hoelk-f/semantic-data-catalog');
          const exact = readPublishedVersion(`@hoelk-f/semantic-data-catalog@${pkg.version}`);

          console.log(`Current version: ${pkg.version}`);
          if (latest) {
            console.log(`Published version: ${latest}`);
            if (cmp(pkg.version, latest) < 0) {
              throw new Error(
                `frontend/package.json version (${pkg.version}) is older than the published version (${latest}).`
              );
            }
          }

          if (exact && exact !== pkg.version) {
            throw new Error(`Exact package lookup returned ${exact}, expected ${pkg.version}.`);
          }
          if (latest === pkg.version && !exact) {
            throw new Error(`Latest points to ${pkg.version}, but the exact package lookup returned 404.`);
          }

          const packageExists = exact === pkg.version;
          if (packageExists && process.env.RELEASE_EVENT !== 'workflow_dispatch') {
            throw new Error(
              `Version ${pkg.version} is already published. Bump the version for a normal main push, or use workflow_dispatch to rebuild the existing release.`,
            );
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `package_version=${pkg.version}\npackage_exists=${packageExists}\n`,
          );
          NODE
      - name: Publish package
        if: steps.package-version.outputs.package_exists != 'true'
        run: npm publish
        working-directory: ./frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_FRONTEND }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            son1i/semantic-data-catalog-frontend:latest
            son1i/semantic-data-catalog-frontend:sha-${{ github.sha }}
      - name: Trigger solid-dataspace-manager rebuild
        env:
          MANAGER_TOKEN: ${{ secrets.MANAGER_DISPATCH_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ steps.package-version.outputs.package_version }}
        working-directory: ./frontend
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MANAGER_TOKEN:-}" ]; then
            echo "Missing MANAGER_DISPATCH_TOKEN and fallback NPM_TOKEN; Manager rebuild cannot be dispatched." >&2
            exit 1
          fi

          lookup_exact_version() {
            local output status
            set +e
            output=$(npm view "$1" version --registry https://npm.pkg.github.com --loglevel=error 2>&1)
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              printf '%s' "$output"
              return 0
            fi
            if printf '%s' "$output" | grep -Eqi '(^|[[:space:]])E404|404 Not Found'; then
              return 1
            fi

            printf 'npm view failed for %s:\n%s\n' "$1" "$output" >&2
            return 2
          }

          for attempt in $(seq 1 60); do
            if PUBLISHED_VERSION=$(lookup_exact_version "@hoelk-f/semantic-data-catalog@${PACKAGE_VERSION}"); then
              if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
                echo "Registry returned unexpected version ${PUBLISHED_VERSION:-<empty>} for Catalog ${PACKAGE_VERSION}." >&2
                exit 1
              fi
              break
            else
              LOOKUP_STATUS=$?
            fi

            if [ "$attempt" -eq 60 ]; then
              if [ "$LOOKUP_STATUS" -eq 1 ]; then
                echo "Catalog package ${PACKAGE_VERSION} did not become visible in time." >&2
              else
                echo "Catalog registry lookup kept failing; availability could not be determined." >&2
              fi
              exit 1
            fi

            sleep 10
          done

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${MANAGER_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hoelk-f/solid-dataspace-manager/dispatches \
            -d "{\"event_type\":\"semantic-data-catalog-released\",\"client_payload\":{\"package\":\"@hoelk-f/semantic-data-catalog\",\"version\":\"${PACKAGE_VERSION}\"}}"
